[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lenta-supply-risk"
version = "1.2.0"
description = "Evidence-backed supplier incident scenarios in Neo4j"
requires-python = ">=3.13,<3.15"
dependencies = ["neo4j==6.0.3", "jsonschema==4.25.1"]

[project.scripts]
supply-risk = "supply_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supply_risk = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Neo4j instance"]
